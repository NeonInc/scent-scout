<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ink" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ff5fa8"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#1d1233"/>
      <stop offset="1" stop-color="#07080f"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect id="tile" width="512" height="512" rx="116" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="none" stroke="url(#ink)" stroke-linecap="round" stroke-linejoin="round">
    <!-- cap, neck and bottle -->
    <rect x="206" y="104" width="112" height="58" rx="14" stroke-width="22"/>
    <path d="M228 162v36M296 162v36" stroke-width="22"/>
    <rect x="148" y="198" width="228" height="234" rx="58" stroke-width="24"/>
    <!-- the S for Scent Scout, inside the bottle -->
    <path d="M304 262c-14-20-92-22-92 16c0 40 96 22 96 66c0 38-86 40-100 12" stroke-width="22"/>
  </g>
  <!-- spray mist from the nozzle -->
  <g fill="#ff5fa8" filter="url(#glow)">
    <circle cx="160" cy="118" r="11"/>
    <circle cx="122" cy="96" r="8"/>
    <circle cx="128" cy="142" r="7"/>
    <circle cx="92" cy="122" r="5"/>
  </g>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scent Scout</title>
<meta name="description" content="Find the cheapest price for a fragrance across trusted South African stores, delivery included.">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column built for a phone. Sticky search on top with two tabs (Discover, Watchlist).
   Discover shows rails of picks; search results are a list of fragrances that drop down into
   "smells like" and the store prices. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --sunk: #eef0f4;
  --ink: #0e1116;
  --muted: #5d6471;
  --line: #e4e7ed;
  --accent: #d1145a;
  --accent-ink: #ffffff;
  --accent-soft: #fde8f0;
  --deal: #0e7a4a;
  --deal-soft: #e2f5eb;
  --warn: #8a5a00;
  --warn-soft: #fbf1dc;
  --bad: #b42318;
  --scrim: rgba(14, 17, 22, .45);
  --shadow: 0 12px 32px rgba(14, 17, 22, .12);
  --card: 0 1px 2px rgba(14, 17, 22, .05), 0 2px 8px rgba(14, 17, 22, .04);
  --glow: none;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07080f; --surface: #10121b; --sunk: #181b27; --ink: #eef0f6; --muted: #99a0b1; --line: #232838;
    --accent: #ff4f9a; --accent-ink: #16060d; --accent-soft: #2d1121; --deal: #4ee6a0; --deal-soft: #0e2a1e;
    --warn: #f5c25b; --warn-soft: #2e2410; --bad: #ff7a6e; --scrim: rgba(0, 0, 0, .65); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
    --card: 0 0 0 rgba(0, 0, 0, 0); --glow: 0 0 18px rgba(255, 79, 154, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07080f; --surface: #10121b; --sunk: #181b27; --ink: #eef0f6; --muted: #99a0b1; --line: #232838;
  --accent: #ff4f9a; --accent-ink: #16060d; --accent-soft: #2d1121; --deal: #4ee6a0; --deal-soft: #0e2a1e;
  --warn: #f5c25b; --warn-soft: #2e2410; --bad: #ff7a6e; --scrim: rgba(0, 0, 0, .65); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
  --card: 0 0 0 rgba(0, 0, 0, 0); --glow: 0 0 18px rgba(255, 79, 154, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-weight: 500; }
.lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.hscroll { display: flex; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.hscroll::-webkit-scrollbar { display: none; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: grid; gap: 10px; padding-block: 12px 10px; }
.brandline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.logo { font: 800 24px/1 var(--font-display); letter-spacing: -0.02em; margin: 0; }
.logo a { color: inherit; text-decoration: none; }
.logo span { color: var(--accent); text-shadow: var(--glow); }
.updated { font-size: 12.5px; color: var(--muted); text-align: right; }
.searchrow { display: flex; gap: 8px; }
.search { flex: 1; min-width: 0; position: relative; }
.search input {
  width: 100%; height: 50px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface);
  padding: 0 46px 0 16px; font-size: 16px; -webkit-appearance: none; appearance: none;
}
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.clear { position: absolute; right: 7px; top: 9px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--sunk); font-size: 18px; line-height: 1; }
.filterbtn { height: 50px; min-width: 50px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.filterbtn .count { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 12px; min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; }

/* tabs under the search */
.nav { display: flex; gap: 6px; }
.navbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.navbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ncount { font: 500 12px var(--font-data); opacity: .7; }
.ndot { width: 8px; height: 8px; border-radius: 50%; background: var(--deal); box-shadow: 0 0 0 2px var(--surface); }

/* suggestions dropdown */
.suggest { position: absolute; left: 0; right: 0; top: 56px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; z-index: 30; }
.suggest button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 11px 14px; border-top: 1px solid var(--line); }
.suggest button:first-child { border-top: 0; }
.suggest button.hi, .suggest button:hover { background: var(--accent-soft); }
.suggest .sb { font-size: 12px; color: var(--muted); grid-column: 1; }
.suggest .sn { font-weight: 600; grid-column: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggest .sp { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-size: 13px; color: var(--muted); }
.suggest .sp b { display: block; color: var(--ink); font: 500 15px var(--font-data); }
.suggest .all { display: block; color: var(--accent); font-weight: 600; font-size: 14px; }

/* ---------- discover (home) ---------- */
.home { display: grid; gap: 6px; padding-top: 12px; }
.picks { gap: 8px; padding-block: 2px 4px; }
.pick { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; box-shadow: var(--card); }
.pick:active { transform: scale(.97); }
.sec { padding-top: 14px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.sechead h2 { font: 600 18px/1.2 var(--font-display); margin: 0; }
.sechead p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.seeall { flex: none; border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 0; }
.rail { gap: 10px; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; padding-block: 2px 8px; }
.tile { flex: none; width: 150px; scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 3px; box-shadow: var(--card); }
.tile:active { transform: scale(.98); }
.tile img, .tile .noimgbox { width: 100%; height: 92px; object-fit: contain; background: var(--sunk); border-radius: 10px; margin-bottom: 5px; display: block; }
.tile .tb { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .tn { font: 600 15px/1.2 var(--font-display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; }
.tile .tp { font: 500 16px var(--font-data); margin-top: auto; padding-top: 3px; }
.tile .tp small { font: 500 12px var(--font-body); color: var(--muted); margin-left: 4px; }
.tile .tx { font-size: 12px; font-weight: 600; color: var(--deal); line-height: 1.3; }
.tile .tx.acc { color: var(--accent); }
.tile .tm { font-size: 12px; color: var(--muted); line-height: 1.3; }
.banner { background: var(--deal-soft); border: 1px solid var(--deal); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; margin-top: 4px; }
.banner h2 { font: 600 16px var(--font-display); margin: 0; color: var(--deal); }
.banner ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 14px; }
.banner b { font: 500 14px var(--font-data); }
.banner button { justify-self: start; border: 0; background: none; color: var(--deal); font-weight: 700; padding: 4px 0; }

/* ---------- results ---------- */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 16px 8px; flex-wrap: wrap; }
.bar h2 { font: 600 18px var(--font-display); margin: 0; }
.bar .sub { color: var(--muted); font-size: 14px; }
.back { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 0 0 4px; display: block; }
select.sort { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.list { display: grid; gap: 10px; padding-block: 2px 28px; }

.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--card); }
.item.open { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, var(--glow); }
.ihead { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 12px 14px; min-height: 76px; }
.thumb { width: 52px; height: 52px; border-radius: 10px; background: var(--sunk); object-fit: contain; display: block; }
.thumb.noimg { opacity: 0; }
.iname { min-width: 0; }
.iname .b { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.iname .b, .iname .n { display: block; }
.iname .n { font: 600 17px/1.2 var(--font-display); margin: 1px 0 4px; overflow-wrap: anywhere; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); font-weight: 600; white-space: nowrap; }
.pill.deal { background: var(--deal-soft); color: var(--deal); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.iprice { text-align: right; display: grid; justify-items: end; gap: 1px; }
.iprice .from { font-size: 11.5px; color: var(--muted); }
.iprice .v { font: 500 19px/1.1 var(--font-data); font-variant-numeric: tabular-nums; }
.iprice .w { font-size: 12px; color: var(--muted); white-space: nowrap; }
.chev { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; margin-top: 2px; }
.item.open .chev { transform: rotate(180deg); }

.ibody { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 10px; background: var(--bg); }

/* "smells like" panel */
.scent { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; position: relative; overflow: hidden; }
.scent::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent); box-shadow: var(--glow); }
.slbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--accent); }
.shead { font: 600 17px/1.3 var(--font-display); margin: -4px 0 0; }
.ssub { margin: -4px 0 0; font-size: 14px; color: var(--muted); }
.ssub b { color: var(--ink); font-weight: 600; }
.vibes { display: flex; gap: 6px; flex-wrap: wrap; }
.vchip { border: 0; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; background: var(--sunk); color: var(--ink); white-space: nowrap; }
button.vchip:hover { background: var(--accent-soft); color: var(--accent); }
.vchip.f { background: none; border: 1px solid var(--line); color: var(--muted); padding: 3px 10px; }
.snotes { margin: 0; font-size: 13px; color: var(--muted); }
.snotes span { font-weight: 700; color: var(--ink); margin-right: 4px; }
.sacts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sbtn { min-height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.sbtn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.sbtn b { font: 500 13px var(--font-data); }
.sbtn.link { border: 0; padding: 0 2px; color: var(--muted); font-weight: 600; }

.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab small { font-weight: 400; opacity: .75; margin-left: 4px; }
.offers { display: grid; gap: 8px; }
.offer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.offer.best { border-color: var(--deal); }
.offer.out { opacity: .6; }
.offer .st { font-weight: 600; }
.offer .st .tagbest { color: var(--deal); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-left: 6px; }
.offer .eta { font-size: 12.5px; color: var(--muted); }
.offer .pr { text-align: right; }
.offer .pr .p { font: 500 18px var(--font-data); font-variant-numeric: tabular-nums; }
.offer .pr s { font-size: 12.5px; color: var(--muted); margin-right: 6px; }
.offer .tot { font-size: 12.5px; color: var(--muted); }
.offer .tot b { color: var(--ink); font: 500 13px var(--font-data); }
.offer .title { grid-column: 1 / -1; font-size: 13px; color: var(--muted); min-width: 0; }
.offer .foot { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.go { box-shadow: var(--glow); display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap; }
.offer:not(.best) .go { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.moreoffers { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 6px; }
.note { font-size: 12.5px; color: var(--muted); }
.also { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.also a { font-weight: 600; text-decoration: none; padding-block: 6px; }

.morebtn { justify-self: center; min-height: 44px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--ink); background: none; font-weight: 600; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 26px 18px; text-align: center; color: var(--muted); }
.empty h3 { font: 600 18px var(--font-display); color: var(--ink); margin: 0 0 6px; }
.stub { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.stub .n { font: 600 16px var(--font-display); }
.stub .m { font-size: 13px; color: var(--muted); }

/* ---------- filter sheet ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
.sheet h2 { font: 600 20px var(--font-display); margin: 0; }
.sheethead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.fsec { padding-block: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.fsec:first-of-type { border-top: 0; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; min-height: 40px; }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sw { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; }
.sw small { display: block; color: var(--muted); font-size: 12.5px; }
.sw input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.sheetfoot { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); background: var(--surface); display: flex; gap: 8px; padding-block: 12px 4px; }
.btn { flex: 1; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (min-width: 760px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 10vh; width: 520px; transform: translateX(-50%); border-radius: 20px; max-height: 80vh; }
  .grab { display: none; }
}

/* ---------- info ---------- */
.info { display: grid; gap: 22px; padding-block: 22px 40px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.info h2 { font: 600 17px var(--font-display); color: var(--ink); margin: 0 0 8px; }
.info p { margin: 0 0 8px; max-width: 65ch; }
.tablewrap { overflow-x: auto; }
.dtable { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.dtable th, .dtable td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.dtable th { font-weight: 600; color: var(--ink); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--deal); margin-right: 6px; }
.status-dot.err { background: var(--bad); }

footer.foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; letter-spacing: .02em; }
footer.foot .wrap { padding-block: 18px calc(24px + env(safe-area-inset-bottom, 0px)); }

@media (prefers-reduced-motion: reduce) { .chev { transition: none; } .tile:active, .pick:active { transform: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brandline">
      <h1 class="logo"><a href="./" id="home" aria-label="Scent Scout home">Scent<span>Scout</span></a></h1>
      <div class="updated" id="updated">Loading prices…</div>
    </div>
    <div class="searchrow">
      <div class="search">
        <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               placeholder="Search a fragrance…" aria-label="Search fragrances" role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
        <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>×</button>
        <div class="suggest" id="suggest" role="listbox" hidden></div>
      </div>
      <button class="filterbtn" id="filterbtn" type="button" aria-haspopup="dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span class="flabel">Filters</span><span class="count" id="fcount" hidden>0</span>
      </button>
    </div>
    <nav class="nav" aria-label="Sections">
      <button type="button" class="navbtn" id="navhome" aria-pressed="true">Discover</button>
      <button type="button" class="navbtn" id="navwatch" aria-pressed="false">♡ Watchlist <span class="ncount" id="ncount"></span><span class="ndot" id="ndot" hidden></span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="home" id="homeview" hidden></div>
  <div class="bar">
    <div><button type="button" class="back" id="back" hidden>← Back to Discover</button><h2 id="heading">Specials right now</h2><div class="sub" id="sub"></div></div>
    <select class="sort" id="sort" aria-label="Sort by">
      <option value="total">Cheapest delivered</option>
      <option value="price">Cheapest price</option>
      <option value="ppm">Cheapest per ml</option>
      <option value="disc">Biggest special</option>
    </select>
  </div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle" hidden>
  <div class="grab"></div>
  <div class="sheethead"><h2 id="sheettitle">Filters</h2><button type="button" class="moreoffers" id="reset">Reset</button></div>
  <div class="fsec"><div class="lbl">Bottle size</div><div class="opts" id="sizes"></div></div>
  <div class="fsec">
    <label class="sw" for="specials"><span>Specials only<small>Only prices that are marked down</small></span><input type="checkbox" id="specials"></label>
    <label class="sw" for="instock"><span>In stock only</span><input type="checkbox" id="instock" checked></label>
    <label class="sw" for="dupes"><span>Include “inspired by” alternatives<small>Clones show up when you search the original</small></span><input type="checkbox" id="dupes"></label>
    <label class="sw" for="noassumed"><span>Hide guessed sizes<small>Leave out listings where the store gives no size</small></span><input type="checkbox" id="noassumed"></label>

  <div class="fsec"><div class="lbl">Type</div><div class="opts" id="kinds"></div></div>
  <div class="fsec"><div class="lbl">Stores</div><div class="opts" id="stores"></div></div>
  <div class="sheetfoot"><button type="button" class="btn primary" id="done">Show results</button></div>
</div>

<script>
(function () {
  "use strict";
  var DEFAULT_WATCH = ["Azzaro The Most Wanted", "Montblanc Explorer", "Afnan Lynked Freedom", "Afnan 9pm Night Out", "Hugo Boss Bottled Absolu"];
  var SIZES = [["any", "Any size"], ["30", "30 ml"], ["50", "50 ml"], ["100", "90–125 ml"], ["other", "Other sizes"]];
  var KINDS = [["p", "Perfume"], ["set", "Gift sets"], ["mist", "Body mists"], ["oil", "Oils"]];
  var CONC_WORDS = { EDP: "edp eau parfum", EDT: "edt eau toilette", EDC: "edc cologne", Parfum: "parfum", Extrait: "extrait parfum" };
  var CONC_LABEL = { EDP: "Eau de Parfum", EDT: "Eau de Toilette", EDC: "Cologne", Parfum: "Parfum", Extrait: "Extrait" };
  var STOP = { the: 1, by: 1, for: 1, and: 1, de: 1, la: 1, le: 1, of: 1, a: 1, pour: 1, perfume: 1, fragrance: 1, spray: 1, ml: 1 };
  var CONC_TOK = { eau: 1, parfum: 1, toilette: 1, edp: 1, edt: 1, edc: 1, cologne: 1, extrait: 1, vaporisateur: 1, men: 1, women: 1, man: 1, woman: 1 };
  var PAGE = 20, OFFERS = 4, RAIL = 12;
  // Trusted stores whose prices can't be read automatically (they block automated visits),
  // so each fragrance links straight to their own search instead.
  var ALSO_CHECK = [
    ["Superbalist", "https://superbalist.com/search?q="],
    ["Clicks", "https://clicks.co.za/search?text="],
    ["Dis-Chem", "https://www.dischem.co.za/catalogsearch/result/?q="]
  ];
  // Scent profile words (the collector works these out from the notes the stores list).
  var SEASONS = { sp: ["Spring", "🌸"], su: ["Summer", "☀️"], au: ["Autumn", "🍂"], wi: ["Winter", "❄️"] };
  var WHEN = { d: "Daytime", n: "Evening", b: "Day or night" };
  var FAM = { cit: "Citrusy", fre: "Fresh & airy", grn: "Green vibes", hrb: "Herbal", flo: "Floral", fru: "Fruity", swe: "Sweet",
              spi: "Spicy", woo: "Woody", oud: "Oud", amb: "Warm & ambery", lea: "Leathery & smoky", mus: "Clean & musky", boo: "Boozy" };
  var FAM_PICKS = [["cit,fre,grn", "🍋 Fresh & citrus"], ["swe,amb", "🍯 Sweet & cosy"], ["woo,oud,lea", "🌲 Woody & smoky"], ["flo,fru", "🌷 Floral & fruity"]];
  // Southern hemisphere: Sep–Nov is spring.
  var NOW = ["su", "su", "au", "au", "au", "wi", "wi", "wi", "sp", "sp", "sp", "su"][new Date().getMonth()];

  var $ = function (id) { return document.getElementById(id); };
  var defaults = { size: "any", kinds: { p: true }, specials: false, inStock: true, dupes: false, noAssumed: false };
  var state = { q: "", size: "any", kinds: { p: true }, stores: {}, specials: false, inStock: true, dupes: false, noAssumed: false,
                sort: "total", limit: PAGE, open: null, sizeSel: {}, allOffers: {}, view: "home", preset: null, presetArg: "" };
  var data = null, stores = {}, listings = [], profiles = {}, concsByKey = {}, hi = -1;
  var idxCache = null, pairCache = null, sessionDrops = {}, dropsSeen = false;

  // ---------- watchlist (kept on this device only) ----------
  // Each entry: { q, gk, b, n, ml, p0 (delivered price when saved), last (price last time you visited), at }
  function loadWatch() {
    try { var v = JSON.parse(localStorage.getItem("scentscout.watch2")); if (Array.isArray(v)) return v; } catch (e) {}
    var old = null;
    try { old = JSON.parse(localStorage.getItem("scentscout.watch")); } catch (e) {}
    return (Array.isArray(old) ? old : DEFAULT_WATCH).map(function (q) { return { q: q }; });
  }
  function saveWatch() { try { localStorage.setItem("scentscout.watch2", JSON.stringify(watch)); } catch (e) {} }
  var watch = loadWatch();
  function watchEntry(gk) { for (var i = 0; i < watch.length; i++) if (watch[i].gk === gk) return watch[i]; return null; }

  // ---------- text matching ----------
  function norm(s) {
    s = (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    s = s.replace(/[’'`´]/g, "").replace(/&/g, " and ").replace(/mont\s+blanc/g, "montblanc");
    s = s.replace(/(\d+)\s*pm\b/g, "$1pm").replace(/(\d+)\s*ml\b/g, "$1ml");
    return s.replace(/[^a-z0-9]+/g, " ").trim();
  }
  function toks(s) { return norm(s).split(" ").filter(function (t) { return t && !STOP[t]; }); }
  function nameToks(s) { return toks(s).filter(function (t) { return !CONC_TOK[t] && !/^\d+ml$/.test(t); }); }
  function lev1(a, b) {
    if (Math.abs(a.length - b.length) > 1) return false;
    var i = 0, j = 0, edits = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++edits > 1) return false;
      if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
    }
    return edits + (a.length - i) + (b.length - j) <= 1;
  }
  function tokMatch(q, list) {
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      if (t === q || (q.length >= 2 && t.indexOf(q) === 0)) return true;
      if (q.length >= 5 && t.length >= 4 && lev1(q, t)) return true;
    }
    return false;
  }
  function matches(qt, list) { for (var i = 0; i < qt.length; i++) if (!tokMatch(qt[i], list)) return false; return true; }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function nice(s) { // "CREED AVENTUS" -> "Creed Aventus"
    return s === s.toUpperCase() ? s.toLowerCase().replace(/(^|[\s(\-–/])([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); }) : s;
  }

  // ---------- money ----------
  function R(n) {
    if (n == null || !isFinite(n)) return "–";
    var whole = Math.abs(n - Math.round(n)) < 0.005;
    return "R" + n.toLocaleString("en-US", { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: 2 });
  }
  function fee(li) {
    var d = (stores[li.s] || {}).delivery || {};
    return d.fee == null || li.p >= d.free_over ? 0 : d.fee;
  }
  function tot(li) { return li.p + fee(li); }
  function metric(li, sort) {
    switch (sort || state.sort) {
      case "price": return li.p;
      case "ppm": return li.ml && li.kd !== "set" ? li.p / li.ml : 1e9 + li.p;
      case "disc": return li.w ? -(li.w - li.p) / li.w : 1;
      default: return li.p + fee(li);
    }
  }
  function sizeOk(li) {
    if (state.noAssumed && li.ms === "a") return false;
    if (state.size === "any") return true;
    var m = li.ml;
    if (state.size === "30") return m >= 25 && m <= 35;
    if (state.size === "50") return m >= 40 && m <= 60;
    if (state.size === "100") return m >= 90 && m <= 125;
    return !m || m < 25 || (m > 35 && m < 40) || (m > 60 && m < 90) || m > 125;
  }
  function ago(iso) {
    if (!iso) return "never";
    var h = (Date.now() - new Date(iso).getTime()) / 36e5;
    if (h < 1) return "just now";
    if (h < 48) return Math.round(h) + " h ago";
    return Math.round(h / 24) + " days ago";
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // ---------- data ----------
  function prepare(d) {
    data = d;
    profiles = d.profiles || {};
    d.stores.forEach(function (s) { stores[s.id] = s; state.stores[s.id] = true; });
    listings = d.listings.filter(function (li) { return li.p > 0; });
    listings.forEach(function (li) {
      var st = stores[li.s] || {};
      if (li.u && li.u.charAt(0) === "/") li.u = (st.url || "") + li.u;
      if (li.i && li.i.indexOf("//") === 0) li.i = "https:" + li.i;
      var bare = (li.t || "").split(/\(?\s*(?:inspired\s+by|insp\.?\s+by|inpired\s+by)/i)[0];
      li._t = toks([li.b, bare, li.n, CONC_WORDS[li.c] || "", li.ml ? li.ml + "ml" : ""].join(" "));
      (concsByKey[li.k] = concsByKey[li.k] || {})[li.c || ""] = 1;
      li._ib = li.ib ? toks(li.ib) : [];
    });
  }
  function prof(g) { return profiles[g.gk] || profiles[g.gk.slice(0, g.gk.lastIndexOf("|") + 1)] || null; }

  function presetSpec() {
    var a = state.presetArg;
    switch (state.preset) {
      case "season":
        return { label: SEASONS[a][1] + " " + SEASONS[a][0] + " picks", desc: "Fragrances whose notes suit " + SEASONS[a][0].toLowerCase() + ".",
                 g: function (g) { var p = prof(g); return !!(p && p.s && p.s.indexOf(a) >= 0); } };
      case "price":
        return { label: "Under R" + a, desc: "Bottles for R" + a + " or less.", li: function (li) { return li.p <= +a; } };
      case "gender":
        return { label: a === "m" ? "For him" : "For her", desc: "Including unisex fragrances.", li: function (li) { return li.g === a || li.g === "u"; } };
      case "fam":
        var fs = a.split(","), named = FAM_PICKS.filter(function (x) { return x[0] === a; })[0];
        return { label: named ? named[1] : fs.map(function (f) { return FAM[f]; }).join(" & "), desc: "Based on the notes the stores list.",
                 g: function (g) { var p = prof(g); return !!(p && p.f && p.f.slice(0, 2).some(function (f) { return fs.indexOf(f) >= 0; })); } };
      case "clones":
        return { label: "Designer smell, for less", desc: "Alternatives inspired by famous fragrances.", g: function (g) { return !!pairs().designerOf[g.gk]; } };
      case "alts":
        var d = groupIndex()[a];
        return { label: "Alternatives to " + (d ? d.name : "this fragrance"), desc: "Fragrances that say they’re inspired by it.",
                 g: function (g) { return (pairs().clonesOf[a] || []).indexOf(g.gk) >= 0; } };
      case "drops":
        return { label: "Price drops", desc: "Dropped in the last two weeks or marked down.", li: function (li) { return li.pv || li.w; } };
      case "lows":
        return { label: "Lowest we’ve seen", desc: "At the lowest price we’ve recorded for at least a week.", li: function (li) { return li.ls; } };
    }
    return null;
  }

  function filtered(q, homeSpecials, spec) {
    var qt = toks(q), out = [];
    for (var i = 0; i < listings.length; i++) {
      var li = listings[i];
      if (!state.stores[li.s] || !state.kinds[li.kd]) continue;
      if (state.inStock && !li.st) continue;
      if (state.specials && !li.w) continue;
      if (!sizeOk(li)) continue;
      if (spec && spec.li && !spec.li(li)) continue;
      if (qt.length) {
        if (!matches(qt, li._t) && !(state.dupes && li._ib.length && matches(qt, li._ib))) continue;
      } else if (homeSpecials && !li.w) continue;
      out.push(li);
    }
    return out;
  }

  // One entry per fragrance AND concentration. A listing with no concentration joins the fragrance's
  // only known concentration, if there is exactly one.
  function groupKey(li) {
    if (li.c) return li.k + "|" + li.c;
    var known = Object.keys(concsByKey[li.k] || {}).filter(Boolean);
    return li.k + "|" + (known.length === 1 ? known[0] : "");
  }

  function groupUp(rows, homepage, o) {
    o = o || { sort: state.sort, size: state.size };
    var map = {};
    rows.forEach(function (li) { var gk = groupKey(li); (map[gk] = map[gk] || []).push(li); });
    var groups = Object.keys(map).map(function (gk) {
      var items = map[gk].sort(function (a, b) { return (b.st - a.st) || metric(a, o.sort) - metric(b, o.sort); });
      var best = items[0];
      if (o.size === "any" && o.sort !== "disc") { // headline the cheapest ~100 ml bottle when there is one
        var h = items.filter(function (x) { return x.ml >= 90 && x.ml <= 125 && x.st === best.st; });
        if (h.length) best = h[0];
      }
      var conc = "", img = "", ib = "", st = {};
      items.forEach(function (li) { if (li.c && !conc) conc = li.c; if (!img && li.i) img = li.i; if (!ib && li.ib) ib = li.ib; st[li.s] = 1; });
      var name = items.map(function (x) { return x.n || x.t; }).sort(function (a, b) { return a.length - b.length; })[0];
      return { gk: gk, items: items, best: best, name: name, brand: best.b || "", conc: conc, img: img, ib: ib, nstores: Object.keys(st).length };
    });
    if (homepage && o.sort === "total") {
      groups.sort(function (a, b) { return (b.best.w - b.best.p) / b.best.w - (a.best.w - a.best.p) / a.best.w; });
    } else {
      groups.sort(function (a, b) { return metric(a.best, o.sort) - metric(b.best, o.sort); });
    }
    return groups;
  }

  // Every in-stock perfume, grouped, ignoring the filters. Used for the watchlist and designer/clone pairs.
  function groupIndex() {
    if (idxCache) return idxCache;
    var rows = listings.filter(function (li) { return li.kd === "p" && li.st; });
    idxCache = {};
    groupUp(rows, false, { sort: "total", size: "any" }).forEach(function (g) { idxCache[g.gk] = g; });
    return idxCache;
  }

  // Clone -> the designer fragrance it says it's inspired by, found by brand and name words.
  function pairs() {
    if (pairCache) return pairCache;
    var idx = groupIndex(), byBrand = {}, memo = {}, designerOf = {}, clonesOf = {};
    Object.keys(idx).forEach(function (gk) {
      var g = idx[gk], bt = nameToks(g.brand);
      if (g.ib || !bt.length) return;
      var key = bt.join(" ");
      (byBrand[key] = byBrand[key] || { bt: bt, gs: [] }).gs.push(g);
    });
    var brandKeys = Object.keys(byBrand);
    function findDesigner(ib) {
      var it = nameToks(ib), set = {}, best = null, bestScore = 0;
      it.forEach(function (t) { set[t] = 1; });
      brandKeys.forEach(function (bk) {
        var B = byBrand[bk];
        if (!B.bt.every(function (t) { return set[t]; })) return;
        var rest = it.filter(function (t) { return B.bt.indexOf(t) < 0; });
        if (!rest.length) return;
        B.gs.forEach(function (g) {
          var nt = nameToks(g.name);
          if (!nt.length || !nt.every(function (t) { return set[t]; })) return;
          if (!rest.every(function (t) { return nt.indexOf(t) >= 0; })) return;
          var score = nt.length * 10 + g.nstores;
          if (score > bestScore) { bestScore = score; best = g; }
        });
      });
      return best;
    }
    Object.keys(idx).forEach(function (gk) {
      var g = idx[gk];
      if (!g.ib) return;
      var key = norm(g.ib);
      if (!(key in memo)) memo[key] = findDesigner(g.ib);
      var d = memo[key];
      if (d && d.gk !== gk) { designerOf[gk] = d.gk; (clonesOf[d.gk] = clonesOf[d.gk] || []).push(gk); }
    });
    pairCache = { designerOf: designerOf, clonesOf: clonesOf };
    return pairCache;
  }

  // Suggestions: fragrances whose name starts with what was typed come first, then the most widely stocked.
  // Words like "Eau de Parfum" and "the" are ignored, so "Afnan Lynked Freedom" is an exact match
  // for "Lynked Freedom Eau de Parfum" and beats "Lynked Freedom Black".
  function rankFor(q, groups) {
    var nq = nameToks(q).join(" ");
    groups.forEach(function (g) {
      var nm = nameToks(g.name).join(" "), full = nameToks(g.brand + " " + g.name).join(" ");
      g._score = (nm === nq || full === nq ? 3 : 0) + (nm.indexOf(nq) === 0 || full.indexOf(nq) === 0 ? 4 : 0) + (full.indexOf(nq) >= 0 ? 2 : 0) + Math.min(g.nstores, 5) / 5;
    });
    return groups.sort(function (a, b) { return b._score - a._score; });
  }
  function suggestions(q) {
    if (toks(q).length === 0) return [];
    return rankFor(q, groupUp(filtered(q, false), false)).slice(0, 6);
  }

  // ---------- watchlist prices ----------
  function resolveWatch() {
    var idx = groupIndex(), changed = false;
    watch.forEach(function (e) {
      if (e.gk && idx[e.gk]) return;
      if (e.gk || !e.q) return; // saved fragrance that's out of stock everywhere right now
      var qt = toks(e.q);
      var gs = Object.keys(idx).map(function (k) { return idx[k]; }).filter(function (g) { return matches(qt, toks(g.brand + " " + g.name + " " + (CONC_WORDS[g.conc] || ""))); });
      var g = rankFor(e.q, gs)[0];
      if (g) { e.gk = g.gk; e.b = g.brand; e.n = g.name; changed = true; }
    });
    if (changed) saveWatch();
  }
  // Price for the same bottle size as when it was saved, so a size change never looks like a drop.
  function watchPrice(e, g) {
    var same = e.ml ? g.items.filter(function (li) { return li.st && li.ml === e.ml; }) : [];
    var li = same.length ? same[0] : g.best;
    return { li: li, total: tot(li), sameSize: !e.ml || same.length > 0 };
  }
  function checkDrops() {
    var idx = groupIndex();
    watch.forEach(function (e) {
      var g = e.gk && idx[e.gk];
      if (!g) return;
      var wp = watchPrice(e, g);
      if (!e.ml && wp.li.ml) e.ml = wp.li.ml;
      if (e.p0 == null) e.p0 = wp.total;
      if (e.last != null && wp.sameSize && wp.total < e.last - 0.5) sessionDrops[e.gk] = { from: e.last, to: wp.total };
      e.last = wp.total;
    });
    saveWatch();
  }
  function toggleWatch(gk) {
    var e = watchEntry(gk);
    if (e) { watch.splice(watch.indexOf(e), 1); }
    else {
      var g = groupIndex()[gk] || lastGroups[gk];
      if (!g) return;
      var t = tot(g.best);
      watch.unshift({ q: (g.brand ? g.brand + " " : "") + g.name, gk: gk, b: g.brand, n: g.name, ml: g.best.ml || null, p0: t, last: t, at: new Date().toISOString().slice(0, 10) });
    }
    saveWatch();
  }
  var lastGroups = {};

  // ---------- rendering ----------
  function concName(c) { return CONC_LABEL[c] || c; }

  function renderNav() {
    $("navhome").setAttribute("aria-pressed", String(state.view === "home"));
    $("navwatch").setAttribute("aria-pressed", String(state.view === "watch"));
    $("ncount").textContent = watch.length || "";
    $("ndot").hidden = dropsSeen || !Object.keys(sessionDrops).length;
    $("clear").hidden = !state.q;
  }

  function opts(el, items, isOn, attr) {
    $(el).innerHTML = items.map(function (it) {
      return '<button type="button" class="opt" ' + attr + '="' + it[0] + '" aria-pressed="' + isOn(it[0]) + '">' + esc(it[1]) + "</button>";
    }).join("");
  }
  function renderFilters() {
    opts("sizes", SIZES, function (v) { return state.size === v; }, "data-size");
    opts("kinds", KINDS, function (v) { return !!state.kinds[v]; }, "data-kind");
    opts("stores", data.stores.map(function (s) { return [s.id, s.name]; }), function (v) { return !!state.stores[v]; }, "data-store");
    $("specials").checked = state.specials; $("instock").checked = state.inStock; $("dupes").checked = state.dupes; $("noassumed").checked = state.noAssumed;
    var n = (state.size !== "any") + state.specials + !state.inStock + state.dupes + state.noAssumed +
      (Object.keys(state.kinds).filter(function (k) { return state.kinds[k]; }).join() !== "p") +
      data.stores.filter(function (s) { return !state.stores[s.id]; }).length;
    $("fcount").hidden = !n; $("fcount").textContent = n;
  }

  function badges(li) {
    var b = [];
    if (li.w) b.push('<span class="pill deal">−' + Math.round((li.w - li.p) / li.w * 100) + "% special</span>");
    if (li.pv) b.push('<span class="pill deal">Dropped from ' + R(li.pv) + "</span>");
    if (li.ls) b.push('<span class="pill deal">Lowest we’ve seen</span>');
    else if (li.lo && li.lo < li.p - 0.5) b.push('<span class="pill" title="Lowest price recorded on ' + esc(li.lod) + '">Was ' + R(li.lo) + " on " + esc((li.lod || "").slice(5)) + "</span>");
    if (li.ms === "a") b.push('<span class="pill warn" title="The store doesn’t list the size. It’s the dearer of its listings, so it’s taken to be the 100 ml.">Size guessed</span>');
    if (li.ms === "m") b.push('<span class="pill" title="The store doesn’t list the size. Another store sells it at exactly this price in this size.">Size matched by price</span>');
    if (li.kd === "set") b.push('<span class="pill acc">Gift set</span>');
    if (li.dl) b.push('<span class="pill acc">' + esc(li.dl) + "</span>");
    if (!li.st) b.push('<span class="pill">Out of stock</span>');
    if (li.stale) b.push('<span class="pill warn">Price may be old</span>');
    return b.join("");
  }

  function offer(li, isBest) {

      '<div><div class="st">' + esc(st.name || li.s) + (isBest ? '<span class="tagbest">Cheapest</span>' : "") + '</div><div class="eta">' + esc(d.eta || "") + "</div></div>" +

  function searchName(g) {

  // "Smells like" panel at the top of an opened fragrance.
  function scentHtml(g) {
    var p = prof(g), P = pairs(), idx = groupIndex();

    var head = "", subs = [];

    if (p && p.like) subs.push("Often compared to <b>" + esc(p.like) + "</b>.");

      if (p.d) chips += '<span class="vchip">' + WHEN[p.d] + "</span>";
      chips += (p.f || []).slice(0, 2).map(function (f) { return '<button type="button" class="vchip f" data-preset="fam" data-arg="' + f + '">' + FAM[f] + "</button>"; }).join("");
    }
    var watched = !!watchEntry(g.gk);
    var acts = '<button type="button" class="sbtn' + (watched ? " on" : "") + '" data-watch="' + esc(g.gk) + '" aria-pressed="' + watched + '">' + (watched ? "♥ On your watchlist" : "♡ Add to watchlist") + "</button>";
    if (designer) acts += '<button type="button" class="sbtn" data-open="' + esc(designer.gk) + '">The original from <b>' + R(tot(designer.best)) + "</b></button>";
    if (clones.length) {
      var low = Math.min.apply(null, clones.map(function (c) { return tot(c.best); }));
      acts += '<button type="button" class="sbtn" data-preset="alts" data-arg="' + esc(g.gk) + '">' + clones.length + " cheaper alternative" + (clones.length > 1 ? "s" : "") + " from <b>" + R(low) + "</b></button>";
    }
    acts += '<a class="sbtn link" href="https://www.google.com/search?q=' + encodeURIComponent("site:fragrantica.com " + searchName(g)) + '" target="_blank" rel="noopener">Reviews on Fragrantica ↗</a>';
    if (!head) return '<div class="sacts">' + acts + "</div>";
    return '<div class="scent"><div class="slbl">Smells like</div><p class="shead">' + esc(head) + "</p>" +
      subs.map(function (s) { return '<p class="ssub">' + s + "</p>"; }).join("") +
      (chips ? '<div class="vibes">' + chips + "</div>" : "") +
      (p && p.n && p.n.length ? '<p class="snotes"><span>Key notes</span>' + p.n.map(esc).join(" · ") + "</p>" : "") +
      '<div class="sacts">' + acts + "</div></div>";

  function bodyHtml(g) {
    var bySize = {};
    g.items.forEach(function (li) { var k = li.ml ? String(li.ml) : "?"; (bySize[k] = bySize[k] || []).push(li); });
    var head = g.best.ml ? String(g.best.ml) : "?";
    var keys = Object.keys(bySize).sort(function (a, c) {
      if (a === head) return -1; if (c === head) return 1;
      return (c === "?" ? -1 : +c) - (a === "?" ? -1 : +a);
    });
    var sel = state.sizeSel[g.gk];
    if (!bySize[sel]) sel = keys[0];
    var rows = bySize[sel], showAll = state.allOffers[g.gk];
    var shown = showAll ? rows : rows.slice(0, OFFERS);
    var tabs = keys.length > 1 ? '<div class="tabs" role="tablist">' + keys.map(function (k) {
      return '<button type="button" class="tab" role="tab" data-gk="' + esc(g.gk) + '" data-sz="' + k + '" aria-selected="' + (k === sel) + '">' +
        sizeLabel(k) + "<small>" + R(bySize[k][0].p + (state.sort === "total" ? fee(bySize[k][0]) : 0)) + "</small></button>";
    }).join("") + "</div>" : '<div class="lbl">' + sizeLabel(sel) + "</div>";
    var anyEst = rows.some(function (li) { return fee(li) && (stores[li.s].delivery || {}).estimated; });
    return '<div class="ibody">' + scentHtml(g) + tabs + '<div class="offers">' +
      shown.map(function (li, i) { return offer(li, i === 0 && rows.length > 1); }).join("") + "</div>" +
      (rows.length > OFFERS ? '<button type="button" class="moreoffers" data-all="' + esc(g.gk) + '">' + (showAll ? "Show fewer stores" : "Show all " + rows.length + " stores") + "</button>" : "") +
      (anyEst ? '<div class="note">* Delivery fee is an estimate. The store doesn’t publish it.</div>' : "") +
      '<div class="also"><span class="note">Also check:</span>' + ALSO_CHECK.map(function (a) {
        return '<a href="' + a[1] + encodeURIComponent(searchName(g)) + '" target="_blank" rel="noopener">' + a[0] + " ↗</a>";
      }).join("") + "</div></div>";
  }

  function item(g, extra) {
    var b = g.best, open = state.open === g.gk;
    lastGroups[g.gk] = g;
    var label = { total: "from", price: "from", ppm: "per ml from", disc: "now" }[state.sort];
    var value = state.sort === "ppm" && b.ml ? R(b.p / b.ml) : state.sort === "total" ? R(b.p + fee(b)) : R(b.p);
    var sub = esc((stores[b.s] || {}).name || "") + (b.ml ? " · " + b.ml + " ml" : "");
    return '<article class="item' + (open ? " open" : "") + '" id="g-' + esc(g.gk) + '">' +
      '<button type="button" class="ihead" data-toggle="' + esc(g.gk) + '" aria-expanded="' + open + '">' +
      (g.img ? '<img class="thumb" loading="lazy" alt="" src="' + esc(g.img) + '">' : '<span class="thumb"></span>') +
      '<span class="iname"><span class="b">' + esc(g.brand || "Unbranded") + '</span><span class="n">' + esc(g.name) + "</span>" +
      '<span class="chips">' + (extra || "") + (g.conc ? '<span class="pill">' + esc(concName(g.conc)) + "</span>" : "") +
      '<span class="pill">' + g.nstores + " store" + (g.nstores > 1 ? "s" : "") + "</span>" +
      (b.w ? '<span class="pill deal">−' + Math.round((b.w - b.p) / b.w * 100) + "%</span>" : "") +
      (g.ib ? '<span class="pill acc">Inspired by ' + esc(nice(g.ib)) + "</span>" : "") +
      (watchEntry(g.gk) && state.view !== "watch" ? '<span class="pill acc">♥</span>' : "") + "</span></span>" +
      '<span class="iprice"><span class="from">' + label + '</span><span class="v">' + value + '</span><span class="w">' + sub + "</span>" +
      '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>' +
      "</button>" + (open ? bodyHtml(g) : "") + "</article>";
  }

  function listHtml(groups) {
    var html = groups.slice(0, state.limit).map(function (g) { return item(g); }).join("");
    if (groups.length > state.limit) html += '<button type="button" class="morebtn" id="more">Show more (' + (groups.length - state.limit) + ")</button>";
    return html;
  }

  // ---------- Discover ----------
  function tile(g, li, extra, muted) {
    li = li || g.best;
    return '<button type="button" class="tile" data-open="' + esc(g.gk) + '">' +
      (g.img ? '<img loading="lazy" alt="" src="' + esc(g.img) + '">' : '<span class="noimgbox"></span>') +
      '<span class="tb">' + esc(g.brand || "Unbranded") + '</span><span class="tn">' + esc(g.name) + "</span>" +
      '<span class="tp">' + R(tot(li)) + (li.ml ? "<small>" + li.ml + " ml</small>" : "") + "</span>" +
      (extra ? '<span class="tx' + (extra.acc ? " acc" : "") + '">' + extra.html + "</span>" : "") +
      (muted ? '<span class="tm">' + muted + "</span>" : "") + "</button>";
  }
  function rail(id, arg, title, desc, tiles) {
    if (tiles.length < 3) return "";
    return '<section class="sec"><div class="sechead"><div><h2>' + title + "</h2>" + (desc ? "<p>" + desc + "</p>" : "") + "</div>" +
      (id ? '<button type="button" class="seeall" data-preset="' + id + '" data-arg="' + esc(arg) + '">See all</button>' : "") +
      '</div><div class="rail hscroll">' + tiles.slice(0, RAIL).join("") + "</div></section>";
  }
  function bestDrop(g) {
    var top = null, pct = 0;
    g.items.forEach(function (li) {
      var from = li.pv || li.w;
      if (!li.st || !from) return;
      var p = (from - li.p) / from;
      if (p > pct && p < 0.8) { pct = p; top = li; }
    });
    return top ? { li: top, pct: pct, from: top.pv || top.w } : null;
  }
  function priceGap(g) {
    var bySize = {}, top = null;
    g.items.forEach(function (li) {
      if (!li.st || !li.ml || (li.ms !== "l" && li.ms !== "d")) return;
      var s = bySize[li.ml] = bySize[li.ml] || {};
      if (!s[li.s] || li.p < s[li.s].p) s[li.s] = li;
    });
    Object.keys(bySize).forEach(function (ml) {
      var arr = Object.keys(bySize[ml]).map(function (k) { return bySize[ml][k]; }).sort(function (a, b) { return a.p - b.p; });
      if (arr.length < 2) return;
      var lo = arr[0], hiP = arr[arr.length - 1].p, gap = hiP - lo.p;
      if (gap / hiP < 0.12 || gap / hiP > 0.65) return; // tiny gaps aren't interesting; huge ones are usually mismatched listings
      if (!top || gap > top.gap) top = { li: lo, gap: gap, hi: hiP };
    });
    return top;
  }

  function homeHtml() {
    var all = groupUp(filtered("", false), false, { sort: "total", size: "any" });
    var idx = groupIndex(), P = pairs(), out = "";
    // price drops on the watchlist since the last visit
    var drops = dropsSeen ? [] : watch.filter(function (e) { return sessionDrops[e.gk]; });
    if (drops.length) {
      out += '<div class="banner"><h2>↓ Price drop' + (drops.length > 1 ? "s" : "") + " on your watchlist</h2><ul>" + drops.slice(0, 3).map(function (e) {
        var d = sessionDrops[e.gk];
        return "<li>" + esc((e.b ? e.b + " " : "") + e.n) + " · <b>" + R(d.to) + "</b> <s>" + R(d.from) + "</s></li>";
      }).join("") + '</ul><button type="button" data-nav="watch">Open your watchlist →</button></div>';
    }
    // quick picks
    var picks = [["season", NOW, SEASONS[NOW][1] + " " + SEASONS[NOW][0] + " picks"]].concat(
      FAM_PICKS.map(function (f) { return ["fam", f[0], f[1]]; }),
      [["price", "500", "Under R500"], ["gender", "m", "For him"], ["gender", "f", "For her"], ["clones", "", "✨ Designer smell, for less"]]);
    out += '<div class="picks hscroll" aria-label="Quick picks">' + picks.map(function (p) {
      return '<button type="button" class="pick" data-preset="' + p[0] + '" data-arg="' + p[1] + '">' + esc(p[2]) + "</button>";
    }).join("") + "</div>";

    // biggest drops
    var dr = all.map(function (g) { var d = bestDrop(g); return d && { g: g, d: d }; }).filter(Boolean)
      .sort(function (a, b) { return (b.d.li.pv ? 0.15 : 0) + b.d.pct - (a.d.li.pv ? 0.15 : 0) - a.d.pct; });
    out += rail("drops", "", "Biggest price drops", "Recently dropped or on special.", dr.slice(0, RAIL).map(function (x) {
      return tile(x.g, x.d.li, { html: "−" + Math.round(x.d.pct * 100) + "% · was " + R(x.d.from + fee(x.d.li)) });
    }));
    // in season now
    var se = all.filter(function (g) { var p = prof(g); return p && p.s && p.s.indexOf(NOW) >= 0 && g.nstores >= 2; })
      .sort(function (a, b) { return (!!b.best.w - !!a.best.w) || (b.nstores - a.nstores) || (tot(a.best) - tot(b.best)); });
    out += rail("season", NOW, SEASONS[NOW][1] + " In season: " + SEASONS[NOW][0], "Picked from their notes. Stocked by two or more stores.", se.slice(0, RAIL).map(function (g) {
      var p = prof(g);
      return tile(g, null, { html: esc((p.f || []).slice(0, 2).map(function (f) { return FAM[f]; }).join(" · ")), acc: true });
    }));
    // designer vs clone: the cheapest alternative for each popular original
    var seen = {}, cl = [];
    all.forEach(function (g) {
      var dk = P.designerOf[g.gk], d = dk && idx[dk];
      if (!d || seen[dk]) return;
      var c = (P.clonesOf[dk] || []).map(function (k) { return idx[k]; }).filter(Boolean).sort(function (a, b) { return tot(a.best) - tot(b.best); })[0];
      if (!c || tot(d.best) < 2 * tot(c.best)) return;
      seen[dk] = 1;
      cl.push({ c: c, d: d });
    });
    cl.sort(function (a, b) { return (b.d.nstores - a.d.nstores) || (tot(b.d.best) - tot(a.d.best)); });
    out += rail("clones", "", "Designer smell, for less", "Alternatives inspired by famous fragrances.", cl.slice(0, RAIL).map(function (x) {
      return tile(x.c, null, { html: "Like " + esc(x.d.name), acc: true }, "Original from " + R(tot(x.d.best)));
    }));
    // same bottle, very different price
    var gp = all.map(function (g) { var x = priceGap(g); return x && { g: g, x: x }; }).filter(Boolean)
      .sort(function (a, b) { return b.x.gap - a.x.gap; });
    out += rail("", "", "Shop around and save", "Same bottle, big price difference between stores.", gp.slice(0, RAIL).map(function (y) {
      return tile(y.g, y.x.li, { html: "Save " + R(y.x.gap) + " at " + esc(stores[y.x.li.s].name) }, "Others up to " + R(y.x.hi));
    }));
    // lowest we've seen
    var lw = all.filter(function (g) { return g.items.some(function (li) { return li.ls && li.st; }); })
      .sort(function (a, b) { return (b.nstores - a.nstores) || (tot(a.best) - tot(b.best)); });
    out += rail("lows", "", "Lowest prices we’ve seen", "At their lowest recorded price.", lw.slice(0, RAIL).map(function (g) {
      var li = g.items.filter(function (x) { return x.ls && x.st; })[0];
      return tile(g, li, { html: "Lowest we’ve seen" });
    }));
    return out;
  }

  // ---------- Watchlist ----------
  function watchHtml() {
    var idx = groupIndex();
    if (!watch.length) return '<div class="empty"><h3>Nothing saved yet</h3><p>Open any fragrance and tap “♡ Add to watchlist”. We’ll show you here when its price drops.</p></div>';
    var rows = watch.map(function (e, i) { return { e: e, g: e.gk && idx[e.gk], i: i }; });
    rows.sort(function (a, b) { return (!!sessionDrops[b.e.gk] - !!sessionDrops[a.e.gk]) || a.i - b.i; });
    return rows.map(function (r) {
      var e = r.e, g = r.g;
      if (!g) {
        return '<div class="stub"><div><div class="n">' + esc(e.n ? (e.b ? e.b + " " : "") + e.n : e.q) + '</div><div class="m">' +

      }

    }).join("");
  }

  function render() {
    renderNav();
    var q = state.q.trim(), spec = state.preset ? presetSpec() : null;

      "<div><h2>Stores and delivery</h2><div class=\"tablewrap\"><table class=\"dtable\"><thead><tr><th>Store</th><th>Delivery</th><th>Free from</th><th>Takes</th></tr></thead><tbody>" + rowsH +

      "<p>Prices last checked " + esc(new Date(data.generated).toLocaleString("en-ZA", { dateStyle: "medium", timeStyle: "short" })) + ". Always confirm the price on the store’s site before you buy.</p></div>";

  // ---------- actions ----------
  function syncUrl() {
    try {
      if (location.protocol.indexOf("http") !== 0) return;
      var u = new URL(location.href);
      if (state.q) u.searchParams.set("q", state.q); else u.searchParams.delete("q");
      if (state.view === "watch" && !state.q) u.searchParams.set("view", "watchlist"); else u.searchParams.delete("view");
      history.replaceState(null, "", u);
    } catch (e) {}
  }
  function setQuery(v, openGk) {
    state.q = v; state.limit = PAGE; state.open = openGk || null; state.allOffers = {};
    if (v) { state.view = "home"; state.preset = null; }
    if ($("q").value !== v) $("q").value = v;
    syncUrl();
    render();
    if (openGk) scrollToItem(openGk);
  }
  function setPreset(id, arg) {
    state.preset = id; state.presetArg = arg || ""; state.view = "home"; state.q = ""; $("q").value = "";
    state.limit = PAGE; state.open = null;
    syncUrl(); render(); scrollTop();
  }
  function setView(v) {
    state.view = v; state.preset = null; state.q = ""; $("q").value = ""; state.open = null; state.limit = PAGE;
    closeSuggest(); syncUrl(); render(); scrollTop();
  }
  function goHome() { if (!$("sheet").hidden) closeSheet(); setView("home"); }
  function scrollTop() { window.scrollTo({ top: 0, behavior: "auto" }); }
  function scrollToItem(gk) {
    var el = document.getElementById("g-" + gk);
    if (!el) return;
    var top = el.getBoundingClientRect().top + window.scrollY - document.querySelector(".top").offsetHeight - 8;
    window.scrollTo({ top: Math.max(0, top), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  function openGroup(gk) {
    var g = groupIndex()[gk] || lastGroups[gk];
    if (g) setQuery(searchName(g), gk);
  }
  function pick(gk) {
    var g = suggestCache.filter(function (x) { return x.gk === gk; })[0];
    closeSuggest(); $("q").blur();
    if (g) setQuery((g.brand ? g.brand + " " : "") + g.name, gk);
  }

  var t;
  $("q").addEventListener("input", function () {
    clearTimeout(t);
    t = setTimeout(function () { renderSuggest(); setQuery($("q").value); }, 160);
  });
  $("q").addEventListener("focus", renderSuggest);
  $("q").addEventListener("keydown", function (e) {
    var btns = [].slice.call($("suggest").querySelectorAll("button"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if ($("suggest").hidden || !btns.length) return;
      e.preventDefault();
      hi = (hi + (e.key === "ArrowDown" ? 1 : -1) + btns.length) % btns.length;
      btns.forEach(function (b, i) { b.classList.toggle("hi", i === hi); });
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (hi >= 0 && btns[hi] && btns[hi].dataset.pick) { pick(btns[hi].dataset.pick); return; }
      clearTimeout(t); setQuery($("q").value); closeSuggest(); $("q").blur();
    } else if (e.key === "Escape") { closeSuggest(); }
  });
  $("suggest").addEventListener("mousedown", function (e) { e.preventDefault(); }); // keep focus while tapping
  $("suggest").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.pick) pick(b.dataset.pick);
    else { closeSuggest(); $("q").blur(); }
  });
  document.addEventListener("click", function (e) { if (!e.target.closest(".search")) closeSuggest(); });
  $("clear").addEventListener("click", function () { setQuery(""); $("q").focus(); });
  $("home").addEventListener("click", function (e) { e.preventDefault(); goHome(); });
  $("navhome").addEventListener("click", function () { setView("home"); });
  $("navwatch").addEventListener("click", function () { setView("watch"); });
  $("back").addEventListener("click", function () { setView("home"); });

  // Taps anywhere in the page: tiles, picks, "See all", chips in the scent panel, watch buttons.
  function onAction(e) {
    var b = e.target.closest("button"); if (!b) return false;
    if (b.dataset.open) { openGroup(b.dataset.open); return true; }
    if (b.dataset.preset) { setPreset(b.dataset.preset, b.dataset.arg); return true; }
    if (b.dataset.nav) { setView(b.dataset.nav); return true; }
    if (b.dataset.watch) { toggleWatch(b.dataset.watch); render(); return true; }
    if (b.dataset.unwatch != null) { watch.splice(+b.dataset.unwatch, 1); saveWatch(); render(); return true; }
    return false;
  }
  $("homeview").addEventListener("click", onAction);
  $("results").addEventListener("click", function (e) {
    if (onAction(e)) return;
    var b = e.target.closest("button"); if (!b) return;
    if (b.id === "more") { state.limit += PAGE; render(); return; }
    if (b.dataset.toggle) { var gk = b.dataset.toggle; state.open = state.open === gk ? null : gk; render(); if (state.open) scrollToItem(gk); return; }
    if (b.dataset.sz) { state.sizeSel[b.dataset.gk] = b.dataset.sz; state.allOffers[b.dataset.gk] = false; render(); return; }
    if (b.dataset.all) { state.allOffers[b.dataset.all] = !state.allOffers[b.dataset.all]; render(); }
  });
  $("sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });

  // filter sheet
  var lastFocus = null;
  function openSheet() { lastFocus = document.activeElement; $("scrim").hidden = false; $("sheet").hidden = false; document.body.style.overflow = "hidden"; $("done").focus(); }
  function closeSheet() { $("scrim").hidden = true; $("sheet").hidden = true; document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); }
  $("filterbtn").addEventListener("click", openSheet);
  $("scrim").addEventListener("click", closeSheet);
  $("done").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
  $("sheet").addEventListener("click", function (e) {
    var b = e.target.closest("button.opt"); if (!b) return;
    if (b.dataset.size) state.size = b.dataset.size;
    if (b.dataset.kind) { state.kinds[b.dataset.kind] = !state.kinds[b.dataset.kind]; if (!Object.keys(state.kinds).some(function (k) { return state.kinds[k]; })) state.kinds.p = true; }
    if (b.dataset.store) state.stores[b.dataset.store] = !state.stores[b.dataset.store];
    state.limit = PAGE; renderFilters(); render();
  });
  [["specials", "specials"], ["instock", "inStock"], ["dupes", "dupes"], ["noassumed", "noAssumed"]].forEach(function (p) {
    $(p[0]).addEventListener("change", function (e) { state[p[1]] = e.target.checked; state.limit = PAGE; renderFilters(); render(); });
  });
  $("reset").addEventListener("click", function () {
    Object.keys(defaults).forEach(function (k) { state[k] = JSON.parse(JSON.stringify(defaults[k])); });
    data.stores.forEach(function (s) { state.stores[s.id] = true; });
    renderFilters(); render();
  });
  document.addEventListener("error", function (e) { if (e.target && e.target.tagName === "IMG") e.target.classList.add("noimg"); }, true);

  function start(d) {
    prepare(d); renderFilters(); renderInfo();
    resolveWatch(); checkDrops();
    var bad = d.stores.filter(function (s) { return s.status !== "ok"; }).length;
    $("updated").textContent = "Prices from " + d.stores.length + " stores · updated " + ago(d.generated) + (bad ? " · " + bad + " store" + (bad > 1 ? "s" : "") + " behind" : "");
    var q0 = "", v0 = "";
    try { var sp = new URLSearchParams(location.search); q0 = sp.get("q") || ""; v0 = sp.get("view") || ""; } catch (e) {}
    if (v0 === "watchlist" && !q0) state.view = "watch";
    setQuery(q0);
  }
  var seed = document.getElementById("seed-data");
  if (seed) start(JSON.parse(seed.textContent));
  else fetch("data/prices.json", { cache: "no-cache" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(start).catch(function (e) {
    $("updated").textContent = "Couldn’t load prices (" + e.message + "). Refresh to try again.";
  });
})();
</script>
</body>
</html>

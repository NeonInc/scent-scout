name: Update prices

on:
  schedule:
    # 05:17 and 17:17 South African time (03:17 / 15:17 UTC)
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      stores:
        description: "Only these store ids (space separated), blank for all"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests==2.32.3

      - name: Offline tests
        run: python tests/test_collector.py

      - name: Collect prices
        run: python collector/collect.py ${{ github.event.inputs.stores }}

      - name: Commit new prices
        run: |
          git config user.name "scent-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.json data/history.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update prices $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

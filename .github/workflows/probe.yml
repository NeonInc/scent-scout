name: Probe stores

# Manual only: fetches a list of store pages and saves the raw responses on the "probe" branch,
# so new stores can be checked before writing a collector for them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python tools/probe.py tools/probe_targets.json
      - name: Save results to the probe branch
        run: |
          git config user.name "scent-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe
          git rm -rq --cached . || true
          git add -f probe
          git commit -qm "Probe results $(date -u +%F)"
          git push -f origin probe
